[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
eidra-core = { path = "crates/eidra-core" }
eidra-llm = { path = "crates/eidra-llm" }
anyhow = "1.0.104"
clap = { version = "4.6", features = ["derive", "env"] }
globset = "0.4.20"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.33"
libc = "0.2.191"
# Plain http only for now: radiance is on localhost. TLS (rustls with ring) comes with the first
# https server (docs/DESIGN.md §13).
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0"
tokio = { version = "1.54", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
toml = "0.9.8"
tree-sitter = "0.27.1"
tree-sitter-bash = "0.25.1"

[profile.release]
lto = "thin"
strip = true
