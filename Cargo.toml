[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
eidra-core = { path = "crates/eidra-core" }
eidra-llm = { path = "crates/eidra-llm" }
eidra-tui = { path = "crates/eidra-tui" }
anyhow = "1.0.104"
clap = { version = "4.6", features = ["derive", "env"] }
# The TUI draws with crossterm alone: ratatui's inline viewport cannot change height (DESIGN.md §12).
crossterm = { version = "0.29", default-features = false, features = ["bracketed-paste", "event-stream"] }
# join_all, for subagents running side by side; reqwest already builds it.
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
globset = "0.4.20"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
# Images for the model: their size, and a smaller copy of one too large (DESIGN.md §10).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
ignore = "0.4.33"
libc = "0.2.191"
pulldown-cmark = { version = "0.13.5", default-features = false }
# https to a model server on another machine (docs/DESIGN.md §13): rustls with ring, which builds
# into the static binary with no system library. reqwest leaves the crypto provider to eidra, which
# pins a server's own certificate with it.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
ring = "0.17"
rustls = { version = "0.23.4", default-features = false, features = ["ring", "std", "tls12"] }
# The other end: `eidra relay --listen` takes TLS, with a certificate it makes itself.
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0"
tokio = { version = "1.54", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
toml = "0.9.8"
tree-sitter = "0.27.1"
tree-sitter-bash = "0.25.1"
tree-sitter-python = "0.25"
unicode-width = "0.2.2"

[profile.release]
lto = "thin"
strip = true
