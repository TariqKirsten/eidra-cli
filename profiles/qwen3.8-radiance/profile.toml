# Qwen3.8 Flash-Next served by radiance (docs/DESIGN.md §2–§5). Everything here is a tuning knob:
# change it, run the evals, keep what wins.
name = "qwen3.8-radiance"
base_url = "http://127.0.0.1:8000/v1"
model = "qwen3.8-flash-next"
api_key_env = "RADIANCE_API_KEY"

[request]
# Counts the reasoning too, so it leaves room for the thinking budget and a large file write.
max_tokens = 32768
# xhigh is the default for Qwen3.8. It is fixed for the whole session: xhigh writes its
# instructions at the start of the system prompt. So changing the effort mid-session would mean
# recomputing the whole prompt, and so would turning thinking off for one step (DESIGN.md §3, R2).
reasoning_effort = "xhigh"
# Reasoning tokens per request before the server closes the reasoning block. Set well above what
# a step needs, so that it only stops runaway reasoning. Tune it with the evals.
thinking_budget = 8192
parallel_tool_calls = true

# Other request fields, sent as given. Unset ones use the model's generation config on the server.
[request.extra]

[context]
# Tokens past which a session stops, subagents' too. The server's window is 262,144, the model's
# trained length. Near its end radiance cuts max_tokens to the room left rather than refusing, so
# replies get shorter, and a prompt that no longer fits at all ends the session as the limit does
# (DESIGN.md §8).
limit = 256000
# Past this, the conversation is summarised and goes on in a new one, which starts with the same
# system prompt and the summary: one short prefill instead of a stop. Quality falls off before the
# window's end; tune it with the evals (DESIGN.md §8).
compact_at = 200000

[tools]
# Add "task" to let the model hand work to subagents ([subagents] below). It stays off until the
# evals show it helps (DESIGN.md §5.1).
enabled = ["bash", "bash_output", "bash_kill", "read", "edit", "write", "glob", "grep", "todo"]
# Added in interactive sessions only. There "task" can also start a subagent in the background,
# and the user goes on talking to the agent while it works (DESIGN.md §5.1). "skill" loads a skill
# from ~/.agents/skills, and is left out when there is none for the model (DESIGN.md §11.1).
# Unattended runs, the evals among them, go without.
interactive = ["task", "skill"]
# Characters of one tool result the model sees; longer output is cut in the middle and saved whole.
output_limit = 30000

# Replacement tool descriptions, by tool name.
[tools.descriptions]

[subagents]
# Subagents running at once. Radiance serves four requests at a time (the agent that started them
# waits meanwhile); three leaves one for anything else using the server.
max_parallel = 3
# Requests each subagent may make before it is stopped.
max_requests = 40
# The same for a subagent started in the background, which does a whole task while the user talks
# to the agent. At 40, the first one Qwen started (a calculator) ran out before testing its work.
background_max_requests = 150
# The tools a subagent gets; unset, the main agent's without "task". A read-only list makes
# explorers instead of workers.
# tools = ["read", "glob", "grep", "bash"]

[diagnostics]
# After each edit or write, these check the file before and after the change, and the problems the
# change introduced are added to its result (DESIGN.md §9). "syntax" is a parse, for where ruff is
# not installed; ty leaves out unresolved imports, which depend on finding the environment. A
# check's tool is looked for in $EIDRA_TOOLS, the project's .venv and PATH.
python = ["syntax", "ruff", "ty"]
# Seconds one check may take.
timeout_s = 10

[confirm]
# Commands that need the user's go-ahead: "git" covers every git command, "git push" only pushes.
commands = []

# What the model is told beyond system.md.
[prompts]
# Replaces {{mode}} in system.md in an unattended session.
headless = """

# Finishing
Nobody is watching this session, and nobody can answer questions. Make reasonable assumptions and keep going until the task is done. Every reply must call a tool. When the task is complete and checked, call `finish` with a short summary of what you changed and how you checked it.
"""
# Replaces {{mode}} when a person is in the loop.
interactive = """

# Replying
When you have done what was asked, reply with a short summary of what you changed and how you checked it.
"""
# Replaces {{mode}} for a subagent. Everything before {{mode}} is the same as the main agent's, so
# the server reuses its cached start.
subagent = """

# Working for another agent
Another agent gave you this task and is waiting for your result. Nobody else is watching, and nobody can answer questions: make reasonable assumptions and keep going until the task is done. Every reply must call a tool. Other agents may be working in the same directory at the same time, so change only the files your task is about. When you are done, call `finish` with what the other agent needs: what you found or changed and where (files and line numbers), how you checked it, and anything you could not do. It sees only that summary.
"""
# Sent when a reply stops at max_tokens; {max_tokens} is replaced.
cut_off = "Your last reply reached the {max_tokens}-token limit and was cut off, so its last tool call was not run. Write large files in smaller parts, or change them with edit."
# Sent in an unattended session when a reply calls no tool.
no_tool_call = "Call a tool: carry on with the task, or call finish if it is complete."
# Starts the user's next message after they stopped a reply before it was finished. Without it the
# model sees the request it was stopped on still unanswered, and takes it up again.
interrupted = "[The user interrupted you before you finished your last reply, and it was discarded.]"
# Brings a background subagent's report, as a message of its own once it ends. {task} is replaced
# with the task's description and {report} with what the subagent reported. Without the last
# sentence, an unfinished report had the agent finish the task itself, a long turn nobody asked for.
task_report = "[The background task \"{task}\" has ended. Its report:]\n\n{report}\n\n[Tell the user how it went. If it did not finish, say what is left, and ask before you take it up yourself.]"
# Asks for the summary a conversation goes on from once it passes [context] compact_at.
compact = """[This conversation is too long to go on with, so it will continue in a new one that starts from a summary you write now. Write it for yourself, with no tools. Include:
- the task and the user's instructions, word for word where they are short;
- what has been done and decided, and why;
- the files changed and how, and the state they are in;
- what is left, as next steps;
- every exact detail needed to go on: paths, names, commands, error messages, values.
Reply with the summary only.]"""
# Starts the conversation after a compaction; {tokens} and {summary} are replaced.
compacted = "[The conversation so far reached {tokens} tokens and was compacted. This is the summary you wrote of it:]\n\n{summary}\n\n[Go on from here.]"
# Added to compact when the user runs /compact with words after it; {focus} is replaced.
compact_focus = "\n\n[The user asked for this summary, and wants it to keep in particular: {focus}]"
# Starts the user's next message after /undo put back what one of the agent's turns changed in the
# workspace. {turn} is the start of the message that began the turn; {restored}, {removed} and
# {kept} list files, or say none. Without it the model believes its changes are still there.
undone = "[The user undid what your turn that began with \"{turn}\" changed in the workspace. Files put back as they were before it: {restored}. Files it made, removed: {removed}. Files it changed that changed again afterwards, left as they are: {kept}.]"
# Starts the user's next message after they ran a command themselves with ! in the TUI: {command}
# is the command, {status} how it ended, and {output} what it printed, cut to [tools] output_limit.
user_command = "[The user ran this command in the workspace: `{command}`. It {status}, and printed:]\n\n{output}"
# A text file the user's message mentions with @path, after the message: {path} is the path and
# {content} the file as read shows it, numbered lines and all, so that it needs no read of its own.
attached_file = "[The user attached {path}, shown as read shows it:]\n{content}"
# Replaces {{skills}} in system.md when the session has the skill tool and ~/.agents/skills holds
# skills for the model (DESIGN.md §11.1). {skills} is a line for each: its name, then its
# description, which says when to use it. Only these are in the prompt; a skill's instructions come
# when it is loaded.
skills = """

# Skills
A skill holds instructions for a kind of task, and often scripts or other files for it. When a task fits one of these descriptions, load that skill with `skill` before you start on it, and follow its instructions:
{skills}
"""
# A skill's instructions: the skill tool's result, and what follows the user's message when they
# invoke a skill with /name. {name} is its name, {dir} its folder and {instructions} its SKILL.md
# after the frontmatter. The folder is where the scripts and files its instructions name are.
skill = "[The skill {name}. Its files are in {dir}, and paths in it are relative to that folder. Follow its instructions:]\n\n{instructions}"
# Added to the result of an edit or write that altered tests of the project's last commit; {tests}
# names them. In the July SWE-rebench baseline, three of six failures were the agent changing the
# project's tests until its change passed them (DESIGN.md §16.5).
changed_tests = "\n\n[This changed tests the project already had: {tests}. They say what the code must go on doing. Unless the task asks for the behaviour they check to change, put them back as they were and change the code instead.]"
# Added to the last tool result once an unattended run has 15% of its requests or time left; {left}
# says how much. In the baseline one attempt ran into both limits still editing code.
budget = "\n\n[Only {left} left for this task. Leave the work in a finished, tested state, and call finish before then.]"
# Added to the system prompt's mode when the agent has no network but the model (the evals' vacuum).
# In the baseline, 14 tool results were network failures, each costing a step or three.
no_network = """

# Network
There is no network here, except to reach you: anything that downloads fails. Installing packages, `uv sync`, and `uv run` without `--no-sync` fail, and so do tests that reach the internet. Work with what is installed, as it is: run the tests with the project's environment, such as `.venv/bin/python -m pytest` or `uv run --no-sync pytest`.
"""
