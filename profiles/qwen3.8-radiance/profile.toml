# Qwen3.8 Flash-Next served by radiance (docs/DESIGN.md §2–§5). Everything here is a tuning knob:
# change it, run the evals, keep what wins.
name = "qwen3.8-radiance"
base_url = "http://127.0.0.1:8000/v1"
model = "qwen3.8-flash-next"
api_key_env = "RADIANCE_API_KEY"

[request]
# Counts the reasoning too, so it leaves room for the thinking budget and a large file write.
max_tokens = 32768
# xhigh is the default for Qwen3.8. It is fixed for the whole session: xhigh writes its
# instructions at the start of the system prompt. So changing the effort mid-session would mean
# recomputing the whole prompt, and so would turning thinking off for one step (DESIGN.md §3, R2).
reasoning_effort = "xhigh"
# Reasoning tokens per request before the server closes the reasoning block. Set well above what
# a step needs, so that it only stops runaway reasoning. Tune it with the evals.
thinking_budget = 8192
parallel_tool_calls = true

# Other request fields, sent as given. Unset ones use the model's generation config on the server.
[request.extra]

[context]
# Prompt tokens past which a session stops (M1) or compacts (M6).
limit = 160000

[tools]
# Add "task" to let the model hand work to subagents ([subagents] below). It stays off until the
# evals show it helps (DESIGN.md §5.1).
enabled = ["bash", "bash_output", "bash_kill", "read", "edit", "write", "glob", "grep", "todo"]
# Characters of one tool result the model sees; longer output is cut in the middle and saved whole.
output_limit = 30000

# Replacement tool descriptions, by tool name.
[tools.descriptions]

[subagents]
# Subagents running at once. Radiance serves four requests at a time (the agent that started them
# waits meanwhile); three leaves one for anything else using the server.
max_parallel = 3
# Requests each subagent may make before it is stopped.
max_requests = 40
# The tools a subagent gets; unset, the main agent's without "task". A read-only list makes
# explorers instead of workers.
# tools = ["read", "glob", "grep", "bash"]

[confirm]
# Commands that need the user's go-ahead: "git" covers every git command, "git push" only pushes.
commands = []

# What the model is told beyond system.md.
[prompts]
# Replaces {{mode}} in system.md in an unattended session.
headless = """

# Finishing
Nobody is watching this session, and nobody can answer questions. Make reasonable assumptions and keep going until the task is done. Every reply must call a tool. When the task is complete and checked, call `finish` with a short summary of what you changed and how you checked it.
"""
# Replaces {{mode}} when a person is in the loop.
interactive = """

# Replying
When you have done what was asked, reply with a short summary of what you changed and how you checked it.
"""
# Replaces {{mode}} for a subagent. Everything before {{mode}} is the same as the main agent's, so
# the server reuses its cached start.
subagent = """

# Working for another agent
Another agent gave you this task and is waiting for your result. Nobody else is watching, and nobody can answer questions: make reasonable assumptions and keep going until the task is done. Every reply must call a tool. Other agents may be working in the same directory at the same time, so change only the files your task is about. When you are done, call `finish` with what the other agent needs: what you found or changed and where (files and line numbers), how you checked it, and anything you could not do. It sees only that summary.
"""
# Sent when a reply stops at max_tokens; {max_tokens} is replaced.
cut_off = "Your last reply reached the {max_tokens}-token limit and was cut off, so its last tool call was not run. Write large files in smaller parts, or change them with edit."
# Sent in an unattended session when a reply calls no tool.
no_tool_call = "Call a tool: carry on with the task, or call finish if it is complete."
